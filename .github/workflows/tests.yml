name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite is integration-style: most files talk to Postgres through
    # Prisma, and scope3Relevance.test.ts asserts against seeded reference
    # data. So CI needs a real database, migrated and seeded, not a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellocarbon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intellocarbon_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/intellocarbon_test?schema=public
      # config/env.ts validates these at import time and exits the process if
      # they are missing or under 32 characters — even a pure unit test fails
      # to import without them. Throwaway values; nothing signs real tokens here.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-continuous-integration
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-continuous-integration

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed reference data
        run: npm run prisma:seed

      - name: npm test
        run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm test
        run: npm test
